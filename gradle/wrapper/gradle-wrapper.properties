distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方源 services.gradle.org 在国内经常超时，改用腾讯云镜像。
# 如需回到官方源，改回 https://services.gradle.org/distributions/gradle-9.5.1-bin.zip 即可。
