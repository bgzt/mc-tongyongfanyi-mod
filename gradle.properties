# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.17-SNAPSHOT

# Mod Properties
# 1.4.0：升级到 Minecraft 26.3（构建用最新的 Fabric Loader 0.20.1 / Fabric API 0.165.0 / ModMenu 21.0.0）。
#        功能与 1.3.0 一致：模组自带 Qwen2.5 0.5B 模型（首次启动自动铺到 Ollama 的 models 目录）。
#        注意：fabric.mod.json 里的 loader/api 最低要求刻意放宽到 0.19.3 / 0.161.0 ——
#        本模组只用到很老的那几个 API，没必要逼玩家升级（26.3 的现有实例大多是 0.19.x + 0.161.x）。
mod_version=1.4.0
maven_group=com.tongyongfanyi
archives_base_name=tongyongfanyi

# Dependencies
fabric_api_version=0.165.0+26.3
modmenu_version=21.0.0

# ---------------------------------------------------------------------------
# 国内镜像（Loom 专用，官方文档见 Fabric Wiki「配置模组开发环境」）
# 官方源慢或连不上时自动走这些镜像；若镜像内容滞后或不可用，注释掉即可回退官方源。
# ---------------------------------------------------------------------------
# 注意：不要设置 loom_libraries_base。BMCLAPI 的 /maven/ 缺少 Minecraft 26.3 的
# 新版本运行库（netty 4.2.15、log4j 2.26.0、fastutil 8.5.18 等），设了会直接构建失败。
# 官方源 libraries.minecraft.net 国内实测可直连。
# loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
# 游戏资源（resources.download.minecraft.net）-> BMCLAPI
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
# 版本清单（piston-meta.mojang.com）-> BMCLAPI
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest.json
# 实验性版本清单（官方源）
loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json
# Fabric 仓库代理
loom_fabric_repository=https://repository.hanbings.io/proxy/
